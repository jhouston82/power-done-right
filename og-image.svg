  <text x="80" y="338" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="400" fill="#fafaf6" letter-spacing="-2">Power</text>
  <text x="80" y="408" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="400" fill="#E8B43A" letter-spacing="-2" font-style="italic">Done</text>
